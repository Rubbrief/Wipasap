<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิภาทรัพย์ — งบการเงิน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#e8f0e8; --white:#ffffff; --surface:#f7f9f7; --border:#e4eae4;
  --text:#1a1f1a; --text-2:#6b7c6b; --text-3:#a0b0a0;
  --blue:#2563eb; --blue-lt:#eff6ff; --green:#16a34a; --green-lt:#f0fdf4;
  --red:#dc2626; --red-lt:#fef2f2; --amber:#d97706; --amber-lt:#fffbeb;
  --purple:#7c3aed; --purple-lt:#f5f3ff;
  --shadow:0 2px 12px rgba(0,0,0,0.06); --shadow-md:0 4px 24px rgba(0,0,0,0.09);
  --r:16px; --r-sm:10px; --font:'Noto Sans Thai','Manrope',sans-serif; --mono:'JetBrains Mono',monospace; --sidebar:240px;
}
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
.sidebar { width:var(--sidebar); min-height:100vh; background:var(--white); display:flex; flex-direction:column; padding:24px 16px; position:fixed; top:0; left:0; bottom:0; z-index:100; box-shadow:2px 0 12px rgba(0,0,0,0.04); }
.logo { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--border); margin-bottom:20px; }
.logo-icon { width:36px; height:36px; background:var(--text); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:0.82rem; color:white; font-weight:800; flex-shrink:0; }
.logo-name { font-size:0.95rem; font-weight:800; letter-spacing:-0.03em; color:var(--text); }
.logo-name span { font-size:0.65rem; font-weight:500; color:var(--text-2); display:block; letter-spacing:0; }
.nav-label { font-size:0.65rem; font-weight:600; color:var(--text-3); letter-spacing:0.1em; text-transform:uppercase; padding:0 8px; margin-bottom:6px; margin-top:10px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm); font-size:0.85rem; font-weight:500; color:var(--text-2); cursor:pointer; transition:all 0.16s; margin-bottom:2px; border:none; background:none; width:100%; text-align:left; font-family:var(--font); }
.nav-item:hover { background:var(--surface); color:var(--text); }
.nav-item.active { background:var(--blue); color:white; font-weight:600; box-shadow:0 4px 12px rgba(37,99,235,0.28); }
.nav-icon { font-size:0.9rem; width:18px; text-align:center; flex-shrink:0; }
.nav-badge { margin-left:auto; background:var(--blue-lt); color:var(--blue); font-size:0.65rem; font-weight:700; padding:2px 7px; border-radius:20px; font-family:var(--mono); }
.nav-item.active .nav-badge { background:rgba(255,255,255,0.22); color:white; }
.sidebar-divider { height:1px; background:var(--border); margin:12px 8px; }
.sidebar-footer { margin-top:auto; padding-top:16px; border-top:1px solid var(--border); }
.company-tag { display:flex; align-items:center; gap:10px; padding:10px 8px; }
.company-avatar { width:34px; height:34px; background:linear-gradient(135deg,#d4622a,#e8a020); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:800; color:white; flex-shrink:0; }
.c-name { font-size:0.78rem; font-weight:700; color:var(--text); }
.c-sub { font-size:0.67rem; color:var(--text-3); }
.main { margin-left:var(--sidebar); flex:1; min-height:100vh; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:22px 28px 0; flex-wrap:wrap; gap:14px; }
.big-num { font-size:2.2rem; font-weight:800; letter-spacing:-0.04em; color:var(--text); font-family:'Manrope',var(--font); line-height:1; }
.big-sub { font-size:0.7rem; color:var(--text-3); display:block; margin-top:2px; }
.tab-group { display:flex; background:var(--white); border-radius:50px; padding:4px; gap:2px; box-shadow:var(--shadow); }
.tab-btn { padding:7px 18px; border-radius:50px; font-size:0.8rem; font-weight:600; color:var(--text-2); cursor:pointer; transition:all 0.18s; border:none; background:none; font-family:var(--font); }
.tab-btn:hover { color:var(--text); }
.tab-btn.active { background:var(--text); color:white; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
.period-chip { display:flex; align-items:center; gap:6px; background:var(--white); border:1px solid var(--border); border-radius:50px; padding:6px 14px; font-size:0.78rem; font-weight:600; color:var(--text); box-shadow:var(--shadow); }
.period-chip .dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
.selector-row { display:flex; align-items:center; gap:8px; padding:16px 28px 8px; flex-wrap:wrap; }
.sel-label { font-size:0.72rem; color:var(--text-3); font-weight:600; }
.month-chips { display:flex; gap:5px; flex-wrap:wrap; }
.month-chip { padding:5px 13px; border-radius:50px; border:1.5px solid var(--border); background:var(--white); font-size:0.78rem; font-weight:500; color:var(--text-2); cursor:pointer; transition:all 0.15s; position:relative; font-family:var(--font); }
.month-chip:hover { border-color:var(--text); color:var(--text); }
.month-chip.active { background:var(--text); border-color:var(--text); color:white; }
.month-chip.has-data::after { content:''; position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--green); border:1.5px solid white; }
.month-chip.active.has-data::after { border-color:var(--text); }
.month-chip.no-data { opacity:0.35; pointer-events:none; }
.content { padding:16px 28px 40px; flex:1; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.kpi-card { background:var(--white); border-radius:var(--r); padding:20px; box-shadow:var(--shadow); transition:box-shadow 0.18s,transform 0.18s; }
.kpi-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
.kpi-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.kpi-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
.kpi-badge { font-size:0.7rem; font-weight:700; font-family:var(--mono); padding:3px 8px; border-radius:50px; }
.badge-up { background:var(--green-lt); color:var(--green); }
.badge-down { background:var(--red-lt); color:var(--red); }
.kpi-val { font-size:1.55rem; font-weight:800; font-family:var(--mono); letter-spacing:-0.03em; line-height:1; margin-bottom:4px; }
.kpi-lbl { font-size:0.72rem; color:var(--text-2); font-weight:500; }
.board { display:grid; grid-template-columns:1.15fr 1fr; gap:14px; margin-bottom:16px; }
.card { background:var(--white); border-radius:var(--r); padding:22px; box-shadow:var(--shadow); }
.card-title { font-size:0.82rem; font-weight:700; color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.ct-icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.85rem; }
.stmt { width:100%; border-collapse:collapse; }
.stmt tr { border-bottom:1px solid var(--border); }
.stmt tr:last-child { border-bottom:none; }
.stmt td { padding:9px 4px; font-size:0.83rem; }
.stmt td:last-child { text-align:right; font-family:var(--mono); font-size:0.82rem; font-weight:600; }
.stmt .sec-row td { font-size:0.62rem; color:var(--text-3); letter-spacing:0.1em; text-transform:uppercase; padding-top:14px; font-weight:700; }
.stmt .indent { padding-left:12px; color:var(--text-2); }
.stmt .total-row td { font-weight:700; padding-top:10px; border-top:2px solid var(--border); }
.stmt .net-row td { font-size:0.98rem; font-weight:800; color:var(--green); padding:12px 4px 4px; border-top:2px solid var(--green); }
.txt-rev { color:var(--blue) !important; } .txt-exp { color:var(--red) !important; } .txt-prf { color:var(--green) !important; }
.bbar-list { display:flex; flex-direction:column; gap:10px; }
.bbar-row { display:flex; align-items:center; gap:10px; }
.bbar-label { font-size:0.76rem; color:var(--text-2); width:90px; flex-shrink:0; }
.bbar-track { flex:1; height:20px; background:var(--surface); border-radius:6px; overflow:hidden; position:relative; }
.bbar-fill { height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; transition:width 0.7s cubic-bezier(.25,.46,.45,.94); }
.bbar-fill-lbl { font-size:0.65rem; font-family:var(--mono); font-weight:600; color:rgba(255,255,255,0.9); white-space:nowrap; }
.chart-wrap { position:relative; width:100%; }
.chart-wrap canvas { width:100% !important; display:block; }
.chart-tt { position:absolute; background:var(--text); color:white; padding:10px 14px; border-radius:10px; font-size:0.75rem; font-family:var(--mono); pointer-events:none; opacity:0; transition:opacity 0.15s; z-index:10; box-shadow:var(--shadow-md); min-width:170px; line-height:1.7; }
.chart-legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.cl-item { display:flex; align-items:center; gap:6px; font-size:0.72rem; color:var(--text-2); font-weight:500; }
.cl-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.sav-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sav-item { background:var(--surface); border-radius:var(--r-sm); padding:14px; display:flex; align-items:center; gap:10px; }
.sav-ic { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
.sav-lbl { font-size:0.68rem; color:var(--text-2); } .sav-val { font-size:0.92rem; font-weight:700; font-family:var(--mono); color:var(--text); }
.compare-wrap { overflow-x:auto; }
.compare-tbl { width:100%; border-collapse:collapse; }
.compare-tbl th { text-align:right; font-size:0.68rem; font-weight:700; color:var(--text-3); letter-spacing:0.06em; padding:8px 10px; border-bottom:1px solid var(--border); text-transform:uppercase; }
.compare-tbl th:first-child { text-align:left; }
.compare-tbl td { padding:10px 10px; font-size:0.82rem; text-align:right; font-family:var(--mono); border-bottom:1px solid var(--surface); }
.compare-tbl td:first-child { text-align:left; font-family:var(--font); font-size:0.83rem; font-weight:500; }
.compare-tbl tbody tr:hover { background:var(--surface); }
.best { color:var(--green); font-weight:700; } .worst { color:var(--red); }
.form-card { background:var(--white); border-radius:var(--r); padding:22px; box-shadow:var(--shadow); margin-bottom:14px; }
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:14px; }
.fg { display:flex; flex-direction:column; gap:5px; }
.fg label { font-size:0.68rem; font-weight:600; color:var(--text-2); letter-spacing:0.04em; }
.fg input { border:1.5px solid var(--border); border-radius:8px; padding:9px 12px; font-family:var(--mono); font-size:0.85rem; color:var(--text); background:var(--surface); outline:none; transition:border-color 0.15s,background 0.15s; }
.fg input:focus { border-color:var(--blue); background:white; }
.fg input::placeholder { color:var(--text-3); }
.form-actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.btn-primary { display:inline-flex; align-items:center; gap:6px; padding:9px 22px; background:var(--blue); color:white; border:none; border-radius:50px; font-size:0.82rem; font-weight:700; font-family:var(--font); cursor:pointer; box-shadow:0 3px 10px rgba(37,99,235,0.28); transition:opacity 0.15s,transform 0.15s; }
.btn-primary:hover { opacity:0.88; transform:translateY(-1px); }
.btn-danger { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:var(--surface); color:var(--red); border:1.5px solid var(--border); border-radius:50px; font-size:0.82rem; font-weight:700; font-family:var(--font); cursor:pointer; transition:background 0.15s; }
.btn-danger:hover { background:var(--red-lt); border-color:var(--red); }
.empty { text-align:center; padding:56px 20px; color:var(--text-2); }
.em-ic { font-size:2.5rem; margin-bottom:12px; opacity:0.4; }
.em-t { font-size:0.95rem; font-weight:600; margin-bottom:4px; }
.em-s { font-size:0.78rem; color:var(--text-3); }
.toast { position:fixed; bottom:24px; right:24px; background:var(--text); color:white; padding:12px 20px; border-radius:50px; font-size:0.82rem; font-weight:600; z-index:999; opacity:0; transform:translateY(12px); transition:all 0.28s; pointer-events:none; box-shadow:var(--shadow-md); }
.toast.show { opacity:1; transform:translateY(0); }
@media(max-width:900px) { .kpi-grid { grid-template-columns:repeat(2,1fr); } .board { grid-template-columns:1fr; } }
@media(max-width:720px) { .sidebar { display:none; } .main { margin-left:0; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">วภ</div>
    <div class="logo-name">วิภาทรัพย์<span>Financial Dashboard</span></div>
  </div>
  <div class="nav-label">เมนูหลัก</div>
  <button class="nav-item active" onclick="setSection('overview',this)"><span class="nav-icon">📊</span>ภาพรวม<span class="nav-badge" id="nb">0</span></button>
  <button class="nav-item" onclick="setSection('income',this)"><span class="nav-icon">📈</span>รายได้</button>
  <button class="nav-item" onclick="setSection('expense',this)"><span class="nav-icon">📉</span>รายจ่าย</button>
  <button class="nav-item" onclick="setSection('profit',this)"><span class="nav-icon">💰</span>กำไร</button>
  <button class="nav-item" onclick="setSection('compare',this)"><span class="nav-icon">🔁</span>เปรียบเทียบ</button>
  <div class="sidebar-divider"></div>
  <div class="nav-label">จัดการ</div>
  <button class="nav-item" onclick="setSection('input',this)"><span class="nav-icon">✏️</span>กรอกข้อมูล</button>
  <div class="sidebar-footer">
    <div class="company-tag">
      <div class="company-avatar">บจก</div>
      <div><div class="c-name">วิภาทรัพย์ จำกัด</div><div class="c-sub">ปี 2026 – 2030</div></div>
    </div>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <div><div class="big-num" id="topbar-num">—</div><span class="big-sub" id="topbar-sub">รายได้รวมเดือนนี้</span></div>
      <span style="color:var(--text-3);font-size:0.9rem;">฿</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="tab-group" id="year-tabs"></div>
      <div class="period-chip"><span class="dot"></span><span id="topbar-period">—</span></div>
    </div>
  </div>
  <div class="selector-row">
    <span class="sel-label">เดือน :</span>
    <div class="month-chips" id="month-chips"></div>
  </div>
  <div class="content" id="main-content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const YEARS=[2026,2027,2028,2029,2030];
const PRE={'2026-1':{revenue_sales:99900,revenue_gas:18840,revenue_transfer:2230,revenue_longan:3380,exp_stock:54505,exp_stock_yay:33649,exp_gas:16768,exp_longan_labor:1793,exp_deco:0,profit_net:17635},'2026-2':{revenue_sales:79324,revenue_gas:15500,revenue_transfer:2275,revenue_longan:1824,exp_stock:54481,exp_stock_yay:17522,exp_gas:13640,exp_longan_labor:728,exp_deco:0,profit_net:7552},'2026-3':{revenue_sales:90119,revenue_gas:21500,revenue_transfer:2066,revenue_longan:1248,exp_stock:70562,exp_stock_yay:7717,exp_gas:18920,exp_longan_labor:486,exp_deco:0,profit_net:12248},'2026-4':{revenue_sales:95322,revenue_gas:15240,revenue_transfer:1898,revenue_longan:880,exp_stock:63333,exp_stock_yay:3000,exp_gas:13350,exp_longan_labor:0,exp_deco:0,profit_net:28657}};
let db={};
try{const r=localStorage.getItem('wvx2');if(r)db=JSON.parse(r);}catch(e){}
Object.entries(PRE).forEach(([k,v])=>{if(!db[k])db[k]=v;});
function sdb(){try{localStorage.setItem('wvx2',JSON.stringify(db));}catch(e){}}
let selYear=2026,selMonth=4,curSec='overview';
const key=(y,m)=>`${y}-${m}`;
const gd=(y,m)=>db[key(y,m)]||null;
function calc(d){if(!d)return null;const rev=(d.revenue_sales||0)+(d.revenue_gas||0)+(d.revenue_transfer||0)+(d.revenue_longan||0);const exp=(d.exp_stock||0)+(d.exp_stock_yay||0)+(d.exp_gas||0)+(d.exp_longan_labor||0)+(d.exp_deco||0);const net=d.profit_net!==undefined?d.profit_net:rev-exp-5000;return{rev,exp,net,margin:rev?(net/rev*100):0};}
const fmt=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const fmtK=n=>{if(!n&&n!==0)return'—';return Math.abs(n)>=1000?(n/1000).toFixed(1)+'K':n.toFixed(0);};
function chg(c,p){if(!p)return null;const v=((c-p)/Math.abs(p)*100);return{p:Math.abs(v).toFixed(1),up:v>=0};}

function renderSel(){
  document.getElementById('year-tabs').innerHTML=YEARS.map(y=>`<button class="tab-btn ${y===selYear?'active':''}" onclick="selYear=${y};selMonth=1;render()">${y}</button>`).join('');
  document.getElementById('month-chips').innerHTML=MS.map((m,i)=>{const mn=i+1,has=!!db[key(selYear,mn)];return`<button class="month-chip ${mn===selMonth?'active':''} ${has?'has-data':'no-data'}" onclick="selMonth=${mn};render()">${m}</button>`;}).join('');
}
function renderTop(){
  const d=gd(selYear,selMonth),t=calc(d);
  document.getElementById('topbar-num').textContent=t?fmt(t.rev):'—';
  document.getElementById('topbar-period').textContent=`${MTH[selMonth-1]} ${selYear}`;
  let cnt=0;for(let m=1;m<=12;m++)if(db[key(selYear,m)])cnt++;
  document.getElementById('nb').textContent=cnt+' เดือน';
}
function setSection(s,el){curSec=s;document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}

function render(){renderSel();renderTop();const d=gd(selYear,selMonth),t=calc(d),el=document.getElementById('main-content');
  switch(curSec){
    case'overview':el.innerHTML=renderOverview(d,t);setTimeout(()=>drawChart(),60);break;
    case'income':el.innerHTML=renderIncome(d,t);break;
    case'expense':el.innerHTML=renderExpense(d,t);break;
    case'profit':el.innerHTML=renderProfit(d,t);break;
    case'compare':el.innerHTML=renderCompare();break;
    case'input':el.innerHTML=renderForm(d);break;
  }
}

function badge(c){if(!c)return'';return`<span class="kpi-badge ${c.up?'badge-up':'badge-down'}">${c.up?'▲':'▼'}${c.p}%</span>`;}

function renderOverview(d,t){
  if(!d)return`<div class="form-card">${fi(null)}</div>${renderCompare()}`;
  const pd=calc(gd(selYear,selMonth>1?selMonth-1:12));
  const cR=pd?chg(t.rev,pd.rev):null,cE=pd?chg(t.exp,pd.exp):null,cN=pd?chg(t.net,pd.net):null;
  return`<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:var(--blue-lt)">📈</div>${badge(cR)}</div><div class="kpi-val" style="color:var(--blue)">${fmt(t.rev)}</div><div class="kpi-lbl">รายได้รวม (฿)</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:var(--red-lt)">📉</div>${badge(cE?{p:cE.p,up:!cE.up}:null)}</div><div class="kpi-val" style="color:var(--red)">${fmt(t.exp)}</div><div class="kpi-lbl">รายจ่ายรวม (฿)</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:var(--green-lt)">💰</div>${badge(cN)}</div><div class="kpi-val" style="color:var(--green)">${fmt(t.net)}</div><div class="kpi-lbl">กำไรสุทธิ (฿)</div></div>
    <div class="kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:var(--amber-lt)">📊</div></div><div class="kpi-val" style="color:var(--amber)">${t.margin.toFixed(1)}%</div><div class="kpi-lbl">อัตรากำไรสุทธิ</div></div>
  </div>
  <div class="board">
    <div class="card">

function renderCompare(){
  const entries=[];

  const maxR=Math.max(...entries.map(e=>e.rev)),maxN=Math.max(...entries.map(e=>e.net)),minN=Math.min(...entries.map(e=>e.net));
  return`<div class="card"><div class="card-title"><div class="ct-icon" style="background:var(--blue-lt)">🔁</div>เปรียบเทียบทุกเดือน (${entries.length} เดือน)</div><div class="compare-wrap"><table class="compare-tbl"><thead><tr><th>เดือน</th><th>รายได้รวม (฿)</th><th>รายจ่ายรวม (฿)</th><th>กำไรสุทธิ (฿)</th><th>อัตรากำไร</th></tr></thead><tbody>${entries.map(e=>{const bR=e.rev===maxR,bN=e.net===maxN,wN=e.net===minN&&entries.length>1;const mc=e.margin>15?'var(--green)':e.margin>8?'var(--amber)':'var(--red)';return`<tr><td>${e.label}</td><td class="${bR?'best':''}">${fmt(e.rev)}</td><td>${fmt(e.exp)}</td><td class="${bN?'best':wN?'worst':''}">${fmt(e.net)}</td><td style="color:${mc};font-weight:700">${e.margin.toFixed(1)}%</td></tr>`;}).join('')}</tbody></table></div></div>`;
}

function drawChart(){
  const months=[];
  for(let m=1;m<=12;m++){const d=db[key(selYear,m)];if(d){const t=calc(d);months.push({m,t});}}
  const cv=document.getElementById('chart-combined');
  if(!cv||!months.length)return;
  const dpr=window.devicePixelRatio||1,rect=cv.parentElement.getBoundingClientRect();
  const W=rect.width,H=260;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const P={t:24,r:52,b:46,l:66},cW=W-P.l-P.r,cH=H-P.t-P.b,n=months.length;
  const rv=months.map(m=>m.t.rev),ev=months.map(m=>m.t.exp),nv=months.map(m=>m.t.net);
  const lMx=Math.max(...rv,...ev)*1.15||1,lMn=0,rMx=Math.max(...nv)*1.35||1,rMn=Math.min(0,...nv)*1.2;
  const lR=lMx-lMn||1,rR=rMx-rMn||1;
  const toYL=v=>P.t+cH-((v-lMn)/lR*cH);
  const toYR=v=>P.t+cH-((v-rMn)/rR*cH);
  const toX=i=>P.l+(i+0.5)*(cW/n);
  const bGap=3,bGW=Math.min(50,cW/n*0.68),bW=(bGW-bGap)/2;
  const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function frame(){
    ctx.font=`500 10px 'JetBrains Mono',monospace`;
    for(let s=0;s<=5;s++){const v=lMn+(lR/5)*s,y=toYL(v);ctx.strokeStyle='rgba(0,0,0,0.05)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();ctx.fillStyle='#2563eb';ctx.textAlign='right';ctx.fillText(fmtK(v),P.l-6,y+3.5);}
    ctx.textAlign='left';
    for(let s=0;s<=4;s++){const v=rMn+(rR/4)*s,y=toYR(v);ctx.fillStyle='#16a34a';ctx.fillText(fmtK(v),P.l+cW+5,y+3.5);}
    if(rMn<0){ctx.strokeStyle='rgba(220,38,38,0.2)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);const z=toYR(0);ctx.beginPath();ctx.moveTo(P.l,z);ctx.lineTo(P.l+cW,z);ctx.stroke();ctx.setLineDash([]);}
    ctx.fillStyle='#6b7c6b';ctx.font=`500 10px 'Noto Sans Thai',sans-serif`;ctx.textAlign='center';
    months.forEach((mo,i)=>{const iS=mo.m===selMonth;ctx.fillStyle=iS?'#2563eb':'#6b7c6b';ctx.font=iS?`700 10px 'Noto Sans Thai',sans-serif`:`500 10px 'Noto Sans Thai',sans-serif`;ctx.fillText(MS[mo.m-1],toX(i),H-P.b+16);});
    const si=months.findIndex(mo=>mo.m===selMonth);if(si>=0){ctx.fillStyle='rgba(37,99,235,0.05)';ctx.fillRect(toX(si)-cW/n/2,P.t,cW/n,cH);}
  }
  let prog=0;
  function draw(){
    prog=Math.min(prog+0.055,1);const ease=1-Math.pow(1-prog,3);
    ctx.clearRect(0,0,W,H);frame();
    const y0=toYL(0);
    months.forEach((mo,i)=>{
      const cx=toX(i),iS=mo.m===selMonth;
      const rh=y0-toYL(mo.t.rev*ease),rx=cx-bGap/2-bW;
      const rg=ctx.createLinearGradient(rx,y0-rh,rx,y0);rg.addColorStop(0,`rgba(${rgb('#2563eb').join(',')},${iS?1:0.8})`);rg.addColorStop(1,`rgba(${rgb('#2563eb').join(',')},0.25)`);
      ctx.fillStyle=rg;ctx.beginPath();ctx.roundRect(rx,y0-rh,bW,rh,[3,3,0,0]);ctx.fill();
      const eh=y0-toYL(mo.t.exp*ease),ex=cx+bGap/2;
      const eg=ctx.createLinearGradient(ex,y0-eh,ex,y0);eg.addColorStop(0,`rgba(${rgb('#dc2626').join(',')},${iS?0.9:0.7})`);eg.addColorStop(1,`rgba(${rgb('#dc2626').join(',')},0.2)`);
      ctx.fillStyle=eg;ctx.beginPath();ctx.roundRect(ex,y0-eh,bW,eh,[3,3,0,0]);ctx.fill();
      if(iS){ctx.strokeStyle='#2563eb';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(rx-1,y0-rh-1,bW+2,rh+2,[4,4,0,0]);ctx.stroke();ctx.strokeStyle='#dc2626';ctx.beginPath();ctx.roundRect(ex-1,y0-eh-1,bW+2,eh+2,[4,4,0,0]);ctx.stroke();}
    });
    const pg=ctx.createLinearGradient(0,P.t,0,P.t+cH);pg.addColorStop(0,'rgba(22,163,74,0.14)');pg.addColorStop(1,'rgba(22,163,74,0.01)');
    ctx.beginPath();let st=false;
    months.forEach((mo,i)=>{const x=toX(i),y=toYR(rMn+(mo.t.net-rMn)*ease);if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});
    ctx.lineTo(toX(months.length-1),toYR(rMn));ctx.lineTo(toX(0),toYR(rMn));ctx.closePath();ctx.fillStyle=pg;ctx.fill();
    ctx.beginPath();ctx.strokeStyle='#16a34a';ctx.lineWidth=2.5;ctx.lineJoin='round';st=false;
    months.forEach((mo,i)=>{const x=toX(i),y=toYR(rMn+(mo.t.net-rMn)*ease);if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});ctx.stroke();
    months.forEach((mo,i)=>{
      const x=toX(i),y=toYR(rMn+(mo.t.net-rMn)*ease),iS=mo.m===selMonth;
      ctx.beginPath();ctx.arc(x,y,iS?5.5:3.5,0,Math.PI*2);ctx.fillStyle=mo.t.net<0?'#dc2626':'#16a34a';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
      if(prog>0.9){ctx.fillStyle=mo.t.net<0?'#dc2626':'#16a34a';ctx.font=`600 9px 'JetBrains Mono',monospace`;ctx.textAlign='center';ctx.fillText(fmtK(mo.t.net),x,y-10);}
    });
    if(prog<1)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  const tt=document.getElementById('tt-c');
  cv.onmousemove=function(e){const r=cv.getBoundingClientRect(),mx=e.clientX-r.left;let f=null;months.forEach((mo,i)=>{if(Math.abs(mx-toX(i))<cW/n*0.5)f={mo,i};});
    if(f){const{mo}=f,nc=mo.t.net>=0?'#16a34a':'#dc2626';
      tt.innerHTML=`<div style="font-weight:700;margin-bottom:6px">${MTH[mo.m-1]} ${selYear}</div><div style="color:#93c5fd">📈 รายได้&nbsp;&nbsp;&nbsp; ฿${fmt(mo.t.rev)}</div><div style="color:#fca5a5">📉 รายจ่าย&nbsp; ฿${fmt(mo.t.exp)}</div><div style="color:${nc};margin-top:5px;border-top:1px solid rgba(255,255,255,0.15);padding-top:5px">💰 กำไร&nbsp;&nbsp;&nbsp;&nbsp; ฿${fmt(mo.t.net)}</div>`;
      tt.style.opacity='1';let tx=mx+14,ty=e.clientY-r.top-10;if(tx+185>W)tx=mx-200;tt.style.left=tx+'px';tt.style.top=ty+'px';
    }else tt.style.opacity='0';
  };
  cv.onmouseleave=()=>{tt.style.opacity='0';};
}

function saveForm(){const g=id=>{const el=document.getElementById(id);return el?parseFloat(el.value)||0:0;};const d={revenue_sales:g('f1'),revenue_gas:g('f2'),revenue_transfer:g('f3'),revenue_longan:g('f4'),exp_stock:g('f5'),exp_stock_yay:g('f6'),exp_gas:g('f7'),exp_longan_labor:g('f8'),exp_deco:g('f9')};const pe=document.getElementById('f10');if(pe&&pe.value)d.profit_net=parseFloat(pe.value)||0;else{const r=d.revenue_sales+d.revenue_gas+d.revenue_transfer+d.revenue_longan,x=d.exp_stock+d.exp_stock_yay+d.exp_gas+d.exp_longan_labor+d.exp_deco;d.profit_net=r-x-5000;}db[key(selYear,selMonth)]=d;sdb();toast('บันทึกข้อมูลแล้ว ✓');render();}
function clearForm(){if(!confirm(`ลบข้อมูล${MTH[selMonth-1]} ${selYear}?`))return;delete db[key(selYear,selMonth)];sdb();render();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
render();
</script>
</body>
